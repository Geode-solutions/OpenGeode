# mypy configuration for stubtest (check_python_stubs.py stubtest): without it
# mypy refuses to check the stubs generated by pybind11-stubgen, because of
#  - [override]: __eq__(self, other: Point) written as in the binding, whereas
#    object.__eq__ takes an object (pybind11 raises/returns NotImplemented),
#  - [misc]: enums written as `member: ClassVar[Enum]` which mypy 2 does not
#    consider as members.
# Only the stubs are concerned, the signatures are still compared to the runtime.
[mypy]
disable_error_code = override, misc
