# mypy configuration for stubtest (check_python_stubs.py stubtest): without it
# mypy refuses to check the stubs generated by pybind11-stubgen, and stubtest
# then checks nothing. The errors it disables, for these stubs only:
#  - [override] "Argument 1 of "__eq__" is incompatible with supertype
#    "builtins.object"" (and __ne__): the stubs write __eq__(self, other: Point)
#    as in the binding, whereas object.__eq__ takes an object,
#  - [misc] "Detected enum ... in a type stub with zero members": stubgen
#    writes the members as `member: ClassVar[Enum]`, which mypy 2 does not
#    consider as members.
# stubtest still compares the stubs to the runtime: the presence and the kind of
# every member of the compiled modules (their signatures are not available to
# stubtest, inspect.signature fails on pybind11 functions), and the signatures
# of the pure-Python modules.
[mypy]
disable_error_code = override, misc
